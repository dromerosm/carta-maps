name: Feature request
description: Suggest a focused improvement to Carta.
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe your use case and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Include alternatives you have considered, if any.
