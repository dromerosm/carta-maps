name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carta-production
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Verify committed browser assets
        run: git diff --exit-code -- public/
      - name: Deploy the checked commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CARTA_SITE_ORIGIN: ${{ secrets.CARTA_SITE_ORIGIN }}
          CARTA_AUTHOR_ORIGIN: ${{ secrets.CARTA_AUTHOR_ORIGIN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure CLOUDFLARE_API_TOKEN in the production environment.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure CLOUDFLARE_ACCOUNT_ID in the production environment.'; exit 1; }
          npm run deploy:prepare
          npx --no-install wrangler deploy --config dist/deploy/wrangler.jsonc
